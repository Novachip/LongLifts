<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongLifts</title>

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e94560">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LongLifts">
    <link rel="apple-touch-icon" href="icon.svg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: #16213e;
            border: none;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab.active {
            background: #e94560;
            color: white;
        }

        .workout-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .workout-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #e94560;
            background: transparent;
            color: #e94560;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .workout-btn.active {
            background: #e94560;
            color: white;
        }

        .exercise-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .exercise-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .exercise-weight {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weight-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #e94560;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weight-display {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 70px;
            text-align: center;
        }

        .sets-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .set-btn {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #0f0f1a;
            color: #666;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .set-btn .set-num {
            font-weight: bold;
            font-size: 1rem;
        }

        .set-btn .reps {
            font-size: 0.75rem;
        }

        .set-btn.completed {
            background: #2ecc71;
            border-color: #2ecc71;
            color: white;
        }

        .set-btn.failed {
            background: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }

        .complete-workout-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .complete-workout-btn:hover {
            background: #27ae60;
        }

        .complete-workout-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .history-section {
            display: none;
        }

        .history-section.active {
            display: block;
        }

        .workout-section {
            display: none;
        }

        .workout-section.active {
            display: block;
        }

        .history-item {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .history-date {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .history-workout-type {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .history-exercise {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }

        .history-exercise:last-child {
            border-bottom: none;
        }

        .history-sets {
            display: flex;
            gap: 5px;
        }

        .history-set {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .history-set.completed {
            background: #2ecc71;
            color: white;
        }

        .history-set.failed {
            background: #e74c3c;
            color: white;
        }

        .history-set.pending {
            background: #444;
            color: #888;
        }

        .no-history {
            text-align: center;
            color: #666;
            padding: 40px;
        }

        .stats-section {
            display: none;
        }

        .stats-section.active {
            display: block;
        }

        .stat-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .stat-title {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }

        .stat-subtitle {
            color: #666;
            font-size: 0.8rem;
        }

        .exercise-stats {
            margin-top: 20px;
        }

        .exercise-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .exercise-stat-name {
            color: #aaa;
        }

        .exercise-stat-weight {
            font-weight: bold;
            color: #2ecc71;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            background: #e74c3c;
            border: none;
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 30px;
        }

        .info-text {
            background: #16213e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.5;
        }

        .next-workout-indicator {
            text-align: center;
            padding: 10px;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #888;
        }

        .next-workout-indicator strong {
            color: #e94560;
        }

        .rest-timer {
            display: none;
            background: #16213e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 15px;
            text-align: center;
        }

        .rest-timer.active {
            display: block;
        }

        .rest-timer-label {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .rest-timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #e94560;
            font-variant-numeric: tabular-nums;
        }

        .rest-timer.finished .rest-timer-display {
            color: #2ecc71;
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        .rest-timer-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .rest-timer-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .rest-timer-btn.skip {
            background: #333;
            color: #aaa;
        }

        .rest-timer-btn.add-time {
            background: #e94560;
            color: white;
        }

        .rest-timer-btn.dismiss {
            background: #2ecc71;
            color: white;
        }

        .rest-duration-setting {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #333;
        }

        .rest-duration-setting span {
            color: #666;
            font-size: 0.85rem;
        }

        .rest-duration-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: #aaa;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .rest-duration-value {
            color: #aaa;
            font-size: 0.9rem;
            min-width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LongLifts</h1>
        <p class="subtitle">5x5 Dumbbell Tracker</p>

        <div class="tabs">
            <button class="tab active" data-tab="workout">Workout</button>
            <button class="tab" data-tab="history">History</button>
            <button class="tab" data-tab="stats">Stats</button>
        </div>

        <div class="workout-section active" id="workout-section">
            <div class="next-workout-indicator" id="next-workout-indicator">
                Next workout: <strong>Workout A</strong>
            </div>

            <div class="workout-selector">
                <button class="workout-btn active" data-workout="A">Workout A</button>
                <button class="workout-btn" data-workout="B">Workout B</button>
            </div>

            <div class="rest-timer" id="rest-timer">
                <div class="rest-timer-label">Rest Timer</div>
                <div class="rest-timer-display" id="timer-display">1:30</div>
                <div class="rest-timer-buttons">
                    <button class="rest-timer-btn skip" onclick="skipTimer()">Skip</button>
                    <button class="rest-timer-btn add-time" onclick="addTime(30)">+30s</button>
                    <button class="rest-timer-btn dismiss" id="dismiss-btn" onclick="dismissTimer()" style="display:none;">Done</button>
                </div>
                <div class="rest-duration-setting">
                    <span>Rest:</span>
                    <button class="rest-duration-btn" onclick="adjustRestDuration(-15)">−</button>
                    <span class="rest-duration-value" id="rest-duration-value">90s</span>
                    <button class="rest-duration-btn" onclick="adjustRestDuration(15)">+</button>
                </div>
            </div>

            <div id="exercises-container"></div>

            <button class="complete-workout-btn" id="complete-btn">Complete Workout</button>
        </div>

        <div class="history-section" id="history-section">
            <div id="history-container"></div>
        </div>

        <div class="stats-section" id="stats-section">
            <div class="stat-card">
                <div class="stat-title">Total Workouts</div>
                <div class="stat-value" id="total-workouts">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Current Streak</div>
                <div class="stat-value" id="current-streak">0</div>
                <div class="stat-subtitle">consecutive workouts</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Current Weights (per dumbbell)</div>
                <div class="exercise-stats" id="exercise-stats"></div>
            </div>

            <button class="reset-btn" id="reset-btn">Reset All Data</button>
        </div>
    </div>

    <script>
        // Exercise definitions
        const WORKOUTS = {
            A: [
                { id: 'goblet-squat', name: 'Goblet Squat', defaultWeight: 10 },
                { id: 'db-bench', name: 'Dumbbell Bench Press', defaultWeight: 8 },
                { id: 'db-row', name: 'Dumbbell Row', defaultWeight: 8 }
            ],
            B: [
                { id: 'goblet-squat', name: 'Goblet Squat', defaultWeight: 10 },
                { id: 'db-ohp', name: 'Dumbbell Overhead Press', defaultWeight: 5 },
                { id: 'db-rdl', name: 'Dumbbell Romanian Deadlift', defaultWeight: 10 }
            ]
        };

        const SETS_PER_EXERCISE = 5;
        const REPS_PER_SET = 5;
        const WEIGHT_INCREMENT = 1; // kg per dumbbell
        const DEFAULT_REST_DURATION = 90; // seconds

        // State
        let currentWorkout = 'A';
        let currentExercises = [];
        let weights = {};
        let history = [];

        // Timer state
        let restDuration = DEFAULT_REST_DURATION;
        let timerSeconds = 0;
        let timerInterval = null;
        let audioContext = null;

        // Initialize
        function init() {
            loadData();
            setupEventListeners();
            renderWorkout(true);
            updateNextWorkoutIndicator();
        }

        function loadData() {
            const savedWeights = localStorage.getItem('sl-weights');
            const savedHistory = localStorage.getItem('sl-history');
            const savedNextWorkout = localStorage.getItem('sl-next-workout');
            const savedRestDuration = localStorage.getItem('sl-rest-duration');

            if (savedWeights) {
                weights = JSON.parse(savedWeights);
            } else {
                // Initialize default weights
                [...WORKOUTS.A, ...WORKOUTS.B].forEach(ex => {
                    if (!weights[ex.id]) {
                        weights[ex.id] = ex.defaultWeight;
                    }
                });
            }

            if (savedHistory) {
                history = JSON.parse(savedHistory);
            }

            if (savedNextWorkout) {
                currentWorkout = savedNextWorkout;
                updateWorkoutButtons();
            }

            if (savedRestDuration) {
                restDuration = parseInt(savedRestDuration);
                document.getElementById('rest-duration-value').textContent = `${restDuration}s`;
            }
        }

        function saveData() {
            localStorage.setItem('sl-weights', JSON.stringify(weights));
            localStorage.setItem('sl-history', JSON.stringify(history));
            localStorage.setItem('sl-next-workout', currentWorkout === 'A' ? 'B' : 'A');
        }

        function setupEventListeners() {
            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // Workout selection
            document.querySelectorAll('.workout-btn').forEach(btn => {
                btn.addEventListener('click', () => selectWorkout(btn.dataset.workout));
            });

            // Complete workout
            document.getElementById('complete-btn').addEventListener('click', completeWorkout);

            // Reset button
            document.getElementById('reset-btn').addEventListener('click', resetData);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

            document.querySelectorAll('.workout-section, .history-section, .stats-section')
                .forEach(s => s.classList.remove('active'));
            document.getElementById(`${tab}-section`).classList.add('active');

            if (tab === 'history') renderHistory();
            if (tab === 'stats') renderStats();
        }

        function selectWorkout(workout) {
            currentWorkout = workout;
            updateWorkoutButtons();
            renderWorkout(true);
        }

        function updateWorkoutButtons() {
            document.querySelectorAll('.workout-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.workout === currentWorkout);
            });
        }

        function updateNextWorkoutIndicator() {
            const nextWorkout = localStorage.getItem('sl-next-workout') || 'A';
            document.getElementById('next-workout-indicator').innerHTML =
                `Next workout: <strong>Workout ${nextWorkout}</strong>`;
        }

        function renderWorkout(resetSets = false) {
            const container = document.getElementById('exercises-container');
            const exercises = WORKOUTS[currentWorkout];

            // Only reset currentExercises if switching workouts or explicitly requested
            if (resetSets || currentExercises.length === 0 || currentExercises[0].id !== exercises[0].id) {
                currentExercises = exercises.map(ex => ({
                    ...ex,
                    weight: weights[ex.id] || ex.defaultWeight,
                    sets: Array(SETS_PER_EXERCISE).fill(null) // null = pending, true = completed, false = failed
                }));
            } else {
                // Just update weights without resetting sets
                currentExercises.forEach(ex => {
                    ex.weight = weights[ex.id] || ex.weight;
                });
            }

            container.innerHTML = currentExercises.map((ex, exIndex) => `
                <div class="exercise-card">
                    <div class="exercise-header">
                        <span class="exercise-name">${ex.name}</span>
                        <div class="exercise-weight">
                            <button class="weight-btn" onclick="adjustWeight(${exIndex}, -${WEIGHT_INCREMENT})">−</button>
                            <span class="weight-display">${ex.weight} kg</span>
                            <button class="weight-btn" onclick="adjustWeight(${exIndex}, ${WEIGHT_INCREMENT})">+</button>
                        </div>
                    </div>
                    <div class="sets-container">
                        ${ex.sets.map((set, setIndex) => `
                            <button class="set-btn ${set === true ? 'completed' : set === false ? 'failed' : ''}"
                                    onclick="toggleSet(${exIndex}, ${setIndex})">
                                <span class="set-num">${setIndex + 1}</span>
                                <span class="reps">${REPS_PER_SET} reps</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            updateCompleteButton();
        }

        function adjustWeight(exIndex, delta) {
            const exercise = currentExercises[exIndex];
            exercise.weight = Math.max(0, exercise.weight + delta);
            weights[exercise.id] = exercise.weight;
            renderWorkout();
        }

        function toggleSet(exIndex, setIndex) {
            const exercise = currentExercises[exIndex];
            const current = exercise.sets[setIndex];

            // Cycle: null -> true -> false -> null
            if (current === null) {
                exercise.sets[setIndex] = true;
                startTimer(); // Start rest timer when completing a set
            } else if (current === true) {
                exercise.sets[setIndex] = false;
            } else {
                exercise.sets[setIndex] = null;
            }

            renderWorkout();
        }

        // Timer functions
        function startTimer() {
            // Stop any existing timer
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerSeconds = restDuration;
            updateTimerDisplay();

            const timerEl = document.getElementById('rest-timer');
            timerEl.classList.add('active');
            timerEl.classList.remove('finished');
            document.getElementById('dismiss-btn').style.display = 'none';
            document.querySelector('.rest-timer-btn.skip').style.display = 'inline-block';
            document.querySelector('.rest-timer-btn.add-time').style.display = 'inline-block';

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerFinished();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer-display').textContent =
                `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function timerFinished() {
            const timerEl = document.getElementById('rest-timer');
            timerEl.classList.add('finished');
            document.getElementById('timer-display').textContent = "GO!";
            document.getElementById('dismiss-btn').style.display = 'inline-block';
            document.querySelector('.rest-timer-btn.skip').style.display = 'none';
            document.querySelector('.rest-timer-btn.add-time').style.display = 'none';
            playBeep();
        }

        function skipTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('rest-timer').classList.remove('active', 'finished');
        }

        function dismissTimer() {
            document.getElementById('rest-timer').classList.remove('active', 'finished');
        }

        function addTime(seconds) {
            timerSeconds += seconds;
            updateTimerDisplay();
        }

        function adjustRestDuration(delta) {
            restDuration = Math.max(15, Math.min(300, restDuration + delta));
            document.getElementById('rest-duration-value').textContent = `${restDuration}s`;
            localStorage.setItem('sl-rest-duration', restDuration);
        }

        function playBeep() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                // Play 3 beeps
                [0, 150, 300].forEach(delay => {
                    setTimeout(() => {
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();

                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);

                        oscillator.frequency.value = 880;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.3;

                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 0.1);
                    }, delay);
                });
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function updateCompleteButton() {
            const allSetsMarked = currentExercises.every(ex =>
                ex.sets.every(set => set !== null)
            );
            document.getElementById('complete-btn').disabled = !allSetsMarked;
        }

        function completeWorkout() {
            // Check for progression (all sets completed = increase weight)
            currentExercises.forEach(ex => {
                const allCompleted = ex.sets.every(set => set === true);
                if (allCompleted) {
                    weights[ex.id] = (weights[ex.id] || ex.weight) + WEIGHT_INCREMENT;
                }
            });

            // Save to history
            const workoutRecord = {
                date: new Date().toISOString(),
                type: currentWorkout,
                exercises: currentExercises.map(ex => ({
                    id: ex.id,
                    name: ex.name,
                    weight: ex.weight,
                    sets: [...ex.sets]
                }))
            };

            history.unshift(workoutRecord);
            saveData();

            // Show success and switch to next workout
            alert(`Workout complete! ${currentExercises.filter(ex => ex.sets.every(s => s === true)).length} exercise(s) progressed.`);

            currentWorkout = currentWorkout === 'A' ? 'B' : 'A';
            updateWorkoutButtons();
            updateNextWorkoutIndicator();
            renderWorkout(true);
        }

        function renderHistory() {
            const container = document.getElementById('history-container');

            if (history.length === 0) {
                container.innerHTML = '<div class="no-history">No workouts yet. Complete your first workout!</div>';
                return;
            }

            container.innerHTML = history.map(workout => `
                <div class="history-item">
                    <div class="history-date">${formatDate(workout.date)}</div>
                    <div class="history-workout-type">Workout ${workout.type}</div>
                    ${workout.exercises.map(ex => `
                        <div class="history-exercise">
                            <span>${ex.name} @ ${ex.weight} kg</span>
                            <div class="history-sets">
                                ${ex.sets.map(set => `
                                    <div class="history-set ${set === true ? 'completed' : set === false ? 'failed' : 'pending'}">
                                        ${set === true ? '✓' : set === false ? '✗' : '-'}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function renderStats() {
            document.getElementById('total-workouts').textContent = history.length;

            // Calculate streak
            let streak = 0;
            const now = new Date();
            const sortedHistory = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));

            for (let i = 0; i < sortedHistory.length; i++) {
                const workoutDate = new Date(sortedHistory[i].date);
                const daysDiff = Math.floor((now - workoutDate) / (1000 * 60 * 60 * 24));

                // Allow for rest days (up to 3 days between workouts)
                if (i === 0 && daysDiff <= 3) {
                    streak = 1;
                } else if (i > 0) {
                    const prevDate = new Date(sortedHistory[i - 1].date);
                    const gapDays = Math.floor((prevDate - workoutDate) / (1000 * 60 * 60 * 24));
                    if (gapDays <= 3) {
                        streak++;
                    } else {
                        break;
                    }
                }
            }

            document.getElementById('current-streak').textContent = streak;

            // Exercise weights
            const allExercises = [...new Map([...WORKOUTS.A, ...WORKOUTS.B].map(e => [e.id, e])).values()];
            document.getElementById('exercise-stats').innerHTML = allExercises.map(ex => `
                <div class="exercise-stat-row">
                    <span class="exercise-stat-name">${ex.name}</span>
                    <span class="exercise-stat-weight">${weights[ex.id] || ex.defaultWeight} kg</span>
                </div>
            `).join('');
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function resetData() {
            if (confirm('Are you sure you want to reset all data? This cannot be undone.')) {
                localStorage.removeItem('sl-weights');
                localStorage.removeItem('sl-history');
                localStorage.removeItem('sl-next-workout');
                weights = {};
                history = [];
                currentWorkout = 'A';
                init();
                alert('All data has been reset.');
            }
        }

        // Start the app
        init();

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
