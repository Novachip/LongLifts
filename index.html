<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LongLifts</title>
    <meta name="description" content="Track barbell and dumbbell 5×5 and 2×5 strength workouts.">

    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" href="icon.svg" type="image/svg+xml">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LongLifts">
    <link rel="apple-touch-icon" href="icon-180.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>LongLifts</h1>
            <button id="settings-btn" class="icon-btn" data-action="settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            </button>
        </header>
        <main id="view"></main>
    </div>

    <aside id="timer" class="timer" hidden aria-live="polite">
        <div class="timer-track"><div id="timer-fill"></div></div>
        <div class="timer-body">
            <div><span id="timer-label">Rest</span><strong id="timer-value">3:00</strong></div>
            <div class="timer-actions">
                <button id="timer-add" class="btn ghost">+30s</button>
                <button id="timer-skip" class="btn ghost">Skip</button>
            </div>
        </div>
    </aside>

    <nav class="nav" aria-label="Main">
        <button data-action="nav" data-view="train">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Train
        </button>
        <button data-action="nav" data-view="progress">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 15l5-5 4 3 5-7"/></svg>Progress
        </button>
        <button data-action="nav" data-view="history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>History
        </button>
        <button data-action="nav" data-view="guides">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5zM12 6v14"/></svg>Guides
        </button>
    </nav>

    <dialog id="modal" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <div id="modal-actions"></div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>

    <script src="data.js"></script>
    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
